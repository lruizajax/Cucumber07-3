name: Cucumber Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Ejecutar Maven (tests + reportes)
      - name: Build and Run Tests
        run: mvn clean test -B

      # 4. Subir los reportes como artefactos descargables
      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # 5. Publicar en el summary un link al reporte HTML
      - name: Publish Cucumber Report to Summary
        run: |
          echo "### Cucumber Report" >> $GITHUB_STEP_SUMMARY
          echo "El reporte HTML fue generado en **target/cucumber-reports/index.html**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descárgalo desde la sección **Artifacts** al final de esta ejecución." >> $GITHUB_STEP_SUMMARY
