name: Cucumber Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Ejecutar Maven (tests + reportes)
      - name: Build and Run Tests
        run: mvn clean test -B

      # 4. Subir los reportes de Cucumber
      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # 5. Subir los resultados de Allure
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # 6. Generar y subir el reporte HTML de Allure
      - name: Generate Allure Report
        run: mvn allure:report

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/allure-report

      # 7. Publicar info en el summary
      - name: Publish Reports to Summary
        run: |
          echo "### 📊 Cucumber Report" >> $GITHUB_STEP_SUMMARY
          echo "Generado en **target/cucumber-reports/index.html**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "Generado en **target/allure-report/index.html**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Descárgalos desde la sección **Artifacts** de esta ejecución." >> $GITHUB_STEP_SUMMARY
